<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游客评价审核</title>
    <link href="../../static/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1677ff;
            --danger: #ff4d4f;
            --success: #52c41a;
            --bg: #f5f7fa;
            --surface: #ffffff;
            --border: #e5e6eb;
            --text: #606266;
            --text-dark: #1f2329;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, "Microsoft YaHei", "PingFang SC", sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }

        .page-wrap { padding: 24px; min-height: 100vh; }

        .page-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 16px;
        }

        .page-title {
            margin: 0;
            color: var(--text-dark);
            font-size: 24px;
            font-weight: 700;
            line-height: 1.2;
        }

        .page-desc {
            margin-top: 6px;
            color: #8e95a3;
            font-size: 13px;
        }

        .toolbar-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            display: grid;
            grid-template-columns: 170px 220px auto;
            gap: 10px;
            align-items: center;
        }

        .toolbar-actions {
            display: inline-flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .form-select,
        .form-control {
            height: 40px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 14px;
        }

        .form-select:focus,
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.12);
        }

        .btn-primary-blue,
        .btn-ghost-blue,
        .btn-success-outline,
        .btn-danger-outline,
        .btn-outline-gray,
        .btn-row {
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 14px;
            line-height: 1;
            border: 1px solid transparent;
            background: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary-blue {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .btn-primary-blue:hover {
            background: #0958d9;
            border-color: #0958d9;
        }

        .btn-success-outline {
            color: #389e0d;
            border-color: #95de64;
            background: #f6ffed;
        }

        .btn-success-outline:hover { background: #ecffe0; }

        .btn-danger-outline {
            color: var(--danger);
            border-color: var(--danger);
        }

        .btn-danger-outline:hover { background: #fff1f0; }

        .btn-outline-gray {
            color: #4e5969;
            border-color: #dcdfe6;
        }

        .btn-outline-gray:hover { background: #f8fafc; }

        .table-card {
            margin-top: 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .table-responsive-wrap { overflow-x: auto; }

        .audit-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1080px;
        }

        .audit-table th,
        .audit-table td {
            padding: 12px 16px;
            line-height: 48px;
            white-space: nowrap;
            vertical-align: middle;
        }

        .audit-table thead th {
            background: #f7f8fa;
            font-weight: 700;
            color: #303133;
            border-bottom: 1px solid var(--border);
        }

        .audit-table tbody td {
            border-bottom: 1px solid #f0f1f5;
            color: #4e5969;
        }

        .audit-table tbody tr:hover td { background: #fafafa; }

        .score-badge { font-weight: 700; color: #ff7a00; }

        .remark-cell {
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-block;
            vertical-align: middle;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 72px;
            height: 28px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 600;
            line-height: 1;
        }

        .status-pending { color: #ad6800; background: #fff7e6; }
        .status-approved { color: #237804; background: #f6ffed; }
        .status-rejected { color: #a8071a; background: #fff1f0; }

        .action-links {
            display: inline-flex;
            gap: 14px;
            align-items: center;
            line-height: 1;
        }

        .action-link {
            border: none;
            background: transparent;
            padding: 0;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
        }

        .action-link.approve { color: #389e0d; }
        .action-link.reject { color: var(--danger); }

        .action-link:hover { text-decoration: underline; }

        .empty-row {
            text-align: center;
            color: #909399;
            padding: 28px 0;
            line-height: 1.5;
        }

        @media (max-width: 1100px) {
            .toolbar-card { grid-template-columns: 1fr 1fr; }
            .toolbar-actions { grid-column: 1 / -1; justify-content: flex-start; }
        }
    </style>
</head>
<body>
<div class="page-wrap">
    <div class="page-head">
        <div>
            <h1 class="page-title">游客评价审核</h1>
            <div class="page-desc">支持按状态与食堂筛选，并对待审核记录执行批量通过/驳回。</div>
        </div>
        <button class="btn-outline-gray" type="button" onclick="loadRows()"><i class="bi bi-arrow-clockwise"></i>刷新</button>
    </div>

    <div class="toolbar-card">
        <select id="statusFilter" class="form-select">
            <option value="pending">待审核</option>
            <option value="approved">已通过</option>
            <option value="rejected">已驳回</option>
        </select>
        <select id="canteenFilter" class="form-select">
            <option value="0">全部食堂</option>
        </select>
        <div class="toolbar-actions">
            <button class="btn-primary-blue" type="button" onclick="loadRows()"><i class="bi bi-search"></i>查询</button>
            <button class="btn-success-outline" type="button" id="batchApproveBtn" onclick="batchReview('approve')"><i class="bi bi-check-circle"></i>批量通过</button>
            <button class="btn-danger-outline" type="button" id="batchRejectBtn" onclick="batchReview('reject')"><i class="bi bi-x-circle"></i>批量驳回</button>
        </div>
    </div>

    <div class="table-card">
        <div class="table-responsive-wrap">
            <table class="audit-table">
                <thead>
                    <tr>
                        <th style="width: 46px;"><input type="checkbox" id="checkAll" onchange="toggleCheckAll(this.checked)"></th>
                        <th style="width: 80px;">ID</th>
                        <th style="width: 140px;">食堂</th>
                        <th style="width: 130px;">窗口</th>
                        <th style="width: 100px;">身份</th>
                        <th style="width: 110px;">综合分</th>
                        <th style="width: 220px;">备注</th>
                        <th style="width: 100px;">状态</th>
                        <th style="width: 180px;">提交时间</th>
                        <th style="width: 140px;">操作</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    <tr><td colspan="10" class="empty-row">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="../c-client/js/api.js"></script>
<script>
let page = 1;
let limit = 20;
let currentStatus = 'pending';

function getSelectedIds() {
    return Array.from(document.querySelectorAll('.row-check:checked')).map((el) => Number(el.value || 0)).filter((v) => v > 0);
}

function toggleCheckAll(checked) {
    document.querySelectorAll('.row-check').forEach((el) => {
        el.checked = !!checked;
    });
}

function statusText(v) {
    if (v === 'approved') return '已通过';
    if (v === 'rejected') return '已驳回';
    return '待审核';
}

function statusClass(v) {
    if (v === 'approved') return 'status-approved';
    if (v === 'rejected') return 'status-rejected';
    return 'status-pending';
}

function syncActionButtons() {
    const canBatch = currentStatus === 'pending';
    const approveBtn = document.getElementById('batchApproveBtn');
    const rejectBtn = document.getElementById('batchRejectBtn');
    approveBtn.style.display = canBatch ? '' : 'none';
    rejectBtn.style.display = canBatch ? '' : 'none';
    document.getElementById('checkAll').disabled = !canBatch;
}

async function ensureAuth() {
    const me = await fetchApi(API.AUTH_ME, { method: 'GET' });
    if (me.code !== 200) {
        window.top.location.href = 'admin_login.html';
        return null;
    }
    return me.data || {};
}

async function loadCanteensByRole() {
    const user = await ensureAuth();
    if (!user) return;

    const select = document.getElementById('canteenFilter');
    if (String(user.role || '').toLowerCase() === 'operator') {
        const id = Number(user.operator_canteen_id || 0);
        const name = user.operator_canteen_name || '我的食堂';
        select.innerHTML = `<option value="${id}">${name}</option>`;
        select.disabled = true;
        return;
    }

    const res = await fetchApi(API.CANTEENS, { method: 'GET' });
    if (res.code !== 200 || !Array.isArray(res.data)) return;
    let html = '<option value="0">全部食堂</option>';
    res.data.forEach((c) => {
        html += `<option value="${c.id}">${c.name}</option>`;
    });
    select.innerHTML = html;
}

async function approveRow(id) {
    if (!confirm('确认通过该游客评价并入库吗？')) return;
    const res = await fetchApi(`${API_BASE_URL}/admin/guest_evaluations/${id}/approve`, {
        method: 'POST',
        body: JSON.stringify({})
    });
    if (res.code !== 200) {
        alert(res.msg || '操作失败');
        return;
    }
    alert('已通过并入库');
    loadRows();
}

async function rejectRow(id) {
    const reason = prompt('请输入驳回原因：', '内容不符合发布要求');
    if (reason === null) return;
    const res = await fetchApi(`${API_BASE_URL}/admin/guest_evaluations/${id}/reject`, {
        method: 'POST',
        body: JSON.stringify({ reason })
    });
    if (res.code !== 200) {
        alert(res.msg || '操作失败');
        return;
    }
    alert('已驳回');
    loadRows();
}

async function batchReview(action) {
    const ids = getSelectedIds();
    if (!ids.length) {
        alert('请先勾选要处理的记录');
        return;
    }
    let reason = '';
    if (action === 'reject') {
        const input = prompt('请输入批量驳回原因：', '内容不符合发布要求');
        if (input === null) return;
        reason = input;
    }

    const actionText = action === 'approve' ? '批量通过并入库' : '批量驳回';
    if (!confirm(`确认${actionText}已选中的 ${ids.length} 条记录吗？`)) return;

    const res = await fetchApi(`${API_BASE_URL}/admin/guest_evaluations/batch_review`, {
        method: 'POST',
        body: JSON.stringify({ action, ids, reason })
    });
    if (res.code !== 200) {
        alert(res.msg || '批量操作失败');
        return;
    }
    const data = res.data || {};
    alert(`处理完成：成功 ${Number(data.processed_count || 0)} 条，跳过 ${Number(data.skipped_count || 0)} 条`);
    loadRows();
}

async function loadRows() {
    const status = document.getElementById('statusFilter').value;
    currentStatus = status;
    syncActionButtons();
    const canteenId = Number(document.getElementById('canteenFilter').value || 0);
    const qs = new URLSearchParams({ status, page, limit });
    if (canteenId) qs.set('canteen_id', String(canteenId));

    const res = await fetchApi(`${API_BASE_URL}/admin/guest_evaluations?${qs.toString()}`, { method: 'GET' });
    const tbody = document.getElementById('tbody');
    if (res.code !== 200) {
        tbody.innerHTML = `<tr><td colspan="10" class="empty-row">${res.msg || '加载失败'}</td></tr>`;
        return;
    }

    const list = (res.data && Array.isArray(res.data.list)) ? res.data.list : [];
    if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="10" class="empty-row">暂无数据</td></tr>';
        return;
    }

    tbody.innerHTML = list.map((item) => {
        const canSelect = item.status === 'pending';
        const actions = item.status === 'pending'
            ? `<div class="action-links">
                    <button class="action-link approve" onclick="approveRow(${item.id})">通过</button>
                    <button class="action-link reject" onclick="rejectRow(${item.id})">驳回</button>
               </div>`
            : '<span class="text-muted">已审核</span>';
        return `<tr>
            <td><input type="checkbox" class="row-check" value="${item.id}" ${canSelect ? '' : 'disabled'}></td>
            <td>${item.id}</td>
            <td>${item.canteen_name || '-'}</td>
            <td>${item.window_name || '-'}</td>
            <td>${item.identity_type || 'visitor'}</td>
            <td><span class="score-badge">${Number(item.comprehensive_score || 0).toFixed(1)}</span></td>
            <td><span class="remark-cell" title="${item.remark || ''}">${item.remark || '-'}</span></td>
            <td><span class="status-pill ${statusClass(item.status)}">${statusText(item.status)}</span></td>
            <td>${item.create_time || '-'}</td>
            <td>${actions}</td>
        </tr>`;
    }).join('');
}

document.addEventListener('DOMContentLoaded', async () => {
    await loadCanteensByRole();
    syncActionButtons();
    await loadRows();
});
</script>
</body>
</html>
