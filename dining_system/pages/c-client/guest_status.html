<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游客评价状态查询</title>
    <link href="../../static/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fa; font-family: "Microsoft YaHei", sans-serif; }
        .page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .panel { width: 100%; max-width: 560px; background: #fff; border-radius: 14px; border: 1px solid #e5e7eb; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); }
        .status-chip { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
        .status-pending { background: #fff7ed; color: #c2410c; }
        .status-approved { background: #ecfdf3; color: #166534; }
        .status-rejected { background: #fef2f2; color: #991b1b; }
        .hint { color: #6b7280; font-size: 13px; }
    </style>
</head>
<body>
<div class="page">
    <div class="panel p-4">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <h4 class="m-0">游客评价状态查询</h4>
            <a href="quick_evaluation.html" class="btn btn-outline-secondary btn-sm">返回评价页</a>
        </div>

        <div class="mb-2 hint">输入提交成功后的记录 ID，即可查询当前审核状态。</div>

        <div class="input-group mb-3">
            <input id="submissionId" type="number" min="1" class="form-control" placeholder="请输入记录ID，例如 123">
            <button class="btn btn-primary" onclick="queryStatus()">查询</button>
        </div>

        <div class="mb-3">
            <button class="btn btn-outline-secondary btn-sm" onclick="fillFromLocal()">读取本机最近记录</button>
        </div>

        <div id="resultBox" class="border rounded p-3 bg-light d-none"></div>
        <div id="errorBox" class="alert alert-danger d-none mb-0"></div>
    </div>
</div>

<script src="../../static/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
function statusTextAndClass(status) {
    if (status === 'approved') return { text: '已通过', cls: 'status-approved' };
    if (status === 'rejected') return { text: '已驳回', cls: 'status-rejected' };
    return { text: '待审核', cls: 'status-pending' };
}

function renderResult(data) {
    const box = document.getElementById('resultBox');
    const err = document.getElementById('errorBox');
    err.classList.add('d-none');

    const mapped = statusTextAndClass(data.status || 'pending');
    box.innerHTML = `
        <div class="mb-2"><b>记录ID：</b>${data.id || '-'}</div>
        <div class="mb-2"><b>当前状态：</b><span class="status-chip ${mapped.cls}">${mapped.text}</span></div>
        <div class="mb-2"><b>提交时间：</b>${data.create_time || '-'}</div>
        <div class="mb-2"><b>审核时间：</b>${data.reviewed_time || '-'}</div>
        ${data.reject_reason ? `<div><b>驳回原因：</b>${data.reject_reason}</div>` : ''}
    `;
    box.classList.remove('d-none');
}

function renderError(msg) {
    const box = document.getElementById('resultBox');
    const err = document.getElementById('errorBox');
    box.classList.add('d-none');
    err.innerText = msg || '查询失败';
    err.classList.remove('d-none');
}

async function queryStatus() {
    const id = Number(document.getElementById('submissionId').value || 0);
    if (!id) {
        renderError('请输入有效的记录ID');
        return;
    }

    const res = await fetchApi(`/api/guest/evaluations/${id}/status`, { method: 'GET' });
    if (res.code !== 200) {
        renderError(res.msg || '查询失败');
        return;
    }
    renderResult(res.data || {});
}

function fillFromLocal() {
    const latest = Number(localStorage.getItem('guest_last_submission_id') || 0);
    if (!latest) {
        renderError('本机未找到最近游客提交记录');
        return;
    }
    document.getElementById('submissionId').value = String(latest);
    queryStatus();
}

(function initFromQuery() {
    const params = new URLSearchParams(window.location.search || '');
    const id = Number(params.get('id') || 0);
    if (id) {
        document.getElementById('submissionId').value = String(id);
        queryStatus();
    }
})();
</script>
</body>
</html>
