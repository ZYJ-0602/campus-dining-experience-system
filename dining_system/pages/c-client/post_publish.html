<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>发布笔记</title>
    <link href="../../static/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #ff8a00;
            --bg: #f6f7fb;
            --card: #ffffff;
            --text: #2d2f33;
            --muted: #7c8493;
            --border: #d9deea;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            padding: 56px 0 20px;
        }

        .topbar {
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            height: 52px;
            background: #fff;
            border-bottom: 1px solid #eceff6;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
        }

        .topbar .title {
            font-size: 16px;
            font-weight: 700;
        }

        .topbar .cancel-btn {
            color: #5d6472;
            border: none;
            background: transparent;
            font-size: 14px;
            padding: 0;
        }

        .page-wrap {
            width: min(980px, 100%);
            margin: 0 auto;
            padding: 12px;
        }

        .editor-card {
            background: var(--card);
            border: 1px solid #e7eaf3;
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 6px 20px rgba(28, 37, 67, 0.06);
            overflow: hidden;
        }

        .section-title {
            margin: 0 0 10px;
            font-size: 14px;
            color: #5f6778;
            font-weight: 700;
        }

        .input-title {
            width: 100%;
            height: 46px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            background: #fcfdff;
            padding: 0 12px;
            font-size: 16px;
            font-weight: 700;
            outline: none;
        }

        .input-body {
            width: 100%;
            height: 40vh;
            min-height: 260px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            background: #fcfdff;
            padding: 12px;
            resize: vertical;
            outline: none;
            line-height: 1.65;
            font-size: 15px;
        }

        .input-title:focus,
        .input-body:focus,
        .select-base:focus,
        .search-base:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 138, 0, 0.12);
        }

        .section-block { margin-top: 16px; }

        .image-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .thumb,
        .thumb-upload {
            width: 82px;
            height: 82px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            border: 1px solid #dbe1ef;
            background: #fff;
            flex: 0 0 auto;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            cursor: zoom-in;
        }

        .thumb-delete {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.56);
            color: #fff;
            font-size: 12px;
            line-height: 20px;
            padding: 0;
        }

        .thumb-upload {
            border-style: dashed;
            background: #fafbff;
            color: #8890a1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-align: center;
        }

        .thumb-upload i {
            font-size: 22px;
            display: block;
            color: var(--primary);
        }

        .thumb-upload small {
            font-size: 11px;
            display: block;
            margin-top: 4px;
        }

        .tip-line {
            margin-top: 8px;
            color: #9aa1b1;
            font-size: 12px;
        }

        .tags-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag-pill {
            border: 1px solid #d7dbe7;
            color: #60697b;
            background: #f8f9fd;
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }

        .tag-pill.active {
            color: #c26500;
            border-color: #ffc07a;
            background: #fff4e8;
        }

        .custom-tag {
            border: 1px dashed #cdd3e2;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 13px;
            color: #7f8798;
            background: #fff;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .custom-tag input {
            border: none;
            outline: none;
            width: 92px;
            font-size: 13px;
        }

        .select-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .search-base,
        .select-base {
            width: 100%;
            height: 42px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 0 10px;
            outline: none;
            background: #fff;
        }

        .publish-wrap {
            margin-top: 18px;
            display: flex;
            justify-content: center;
        }

        .publish-btn {
            width: min(360px, 100%);
            border: none;
            height: 44px;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(90deg, #ff8a00, #ffab2f);
        }

        .publish-btn:disabled {
            background: #c9cfdb;
            color: #f7f8fb;
        }

        .image-preview-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 16px;
        }

        .image-preview-overlay.show { display: flex; }

        .image-preview-overlay img {
            max-width: 92vw;
            max-height: 90vh;
            border-radius: 12px;
            object-fit: contain;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
        }

        .toast-custom {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: rgba(17, 20, 29, 0.88);
            color: #fff;
            font-size: 13px;
            border-radius: 10px;
            padding: 10px 16px;
            display: none;
            z-index: 120;
        }

        @media (max-width: 768px) {
            .select-grid { grid-template-columns: 1fr; }
            .input-body { height: 42vh; }
        }
    </style>
</head>
<body>
<nav class="topbar">
    <button class="cancel-btn" type="button" onclick="goBack()">取消</button>
    <div class="title" id="pageTitle">发布笔记</div>
    <div style="width:36px;"></div>
</nav>

<div class="page-wrap">
    <div class="editor-card">
        <div class="section-block" style="margin-top:0;">
            <p class="section-title">标题</p>
            <input id="postTitle" class="input-title" type="text" maxlength="200" placeholder="先写一个清晰标题（2-200字）">
        </div>

        <div class="section-block">
            <p class="section-title">正文</p>
            <textarea id="postContent" class="input-body" maxlength="5000" placeholder="写下真实用餐体验、推荐理由或避雷点（至少5字）"></textarea>
        </div>

        <div class="section-block">
            <p class="section-title">图片（最多9张）</p>
            <div id="imageStrip" class="image-strip"></div>
            <div class="tip-line">支持多图上传、缩略展示、点击预览和删除，上传后自动压缩。</div>
            <input id="fileInput" type="file" accept="image/*" multiple hidden>
        </div>

        <div class="section-block">
            <p class="section-title">标签</p>
            <div class="tags-row" id="tagsRow">
                <div class="tag-pill" onclick="toggleTag(this)">#推荐</div>
                <div class="tag-pill" onclick="toggleTag(this)">#避雷</div>
                <div class="tag-pill" onclick="toggleTag(this)">#故事分享</div>
                <label class="custom-tag">#<input id="customTagInput" type="text" placeholder="自定义" maxlength="12"></label>
            </div>
        </div>

        <div class="section-block">
            <p class="section-title" id="canteenSectionTitle">选择评价食堂（必填）</p>
            <div class="select-grid" style="margin-bottom:10px;">
                <select id="campusFilter" class="select-base"></select>
                <input id="canteenSearch" class="search-base" type="text" placeholder="搜索食堂名称...">
            </div>
            <div class="select-grid">
                <select id="canteenSelect" class="select-base"></select>
                <select id="windowSelect" class="select-base" disabled></select>
            </div>
        </div>

        <div class="publish-wrap">
            <button id="publishBtn" class="publish-btn" type="button" disabled>发布笔记</button>
        </div>
    </div>
</div>

<div id="imagePreviewOverlay" class="image-preview-overlay"><img id="imagePreviewTarget" alt="preview"></div>
<div id="toast" class="toast-custom"></div>

<script src="../../static/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
    let editId = null;
    const DRAFT_KEY = 'post_publish_draft';

    const state = {
        images: [],
        campuses: [],
        canteens: [],
        filteredCanteens: [],
        windows: []
    };

    function showToast(msg) {
        const node = document.getElementById('toast');
        node.textContent = msg;
        node.style.display = 'block';
        clearTimeout(node._timer);
        node._timer = setTimeout(() => { node.style.display = 'none'; }, 1800);
    }

    function normalizeCampusList(payload) {
        if (Array.isArray(payload?.data?.list)) return payload.data.list;
        if (Array.isArray(payload?.list)) return payload.list;
        return [];
    }

    function normalizeCanteenList(payload) {
        if (Array.isArray(payload?.data?.list)) return payload.data.list;
        if (Array.isArray(payload?.data)) return payload.data;
        if (Array.isArray(payload)) return payload;
        return [];
    }

    function normalizeWindowList(payload) {
        if (Array.isArray(payload?.data)) return payload.data;
        if (Array.isArray(payload)) return payload;
        return [];
    }

    function buildTagList() {
        const tags = [];
        document.querySelectorAll('#tagsRow .tag-pill.active').forEach((item) => {
            const value = String(item.textContent || '').trim().replace(/^#/, '');
            if (value) tags.push(value);
        });
        return tags;
    }

    function isPublishReady() {
        const title = document.getElementById('postTitle').value.trim();
        const content = document.getElementById('postContent').value.trim();
        const canteenId = Number(document.getElementById('canteenSelect').value || 0);
        if (editId) {
            return title.length >= 2 && content.length >= 5;
        }
        return title.length >= 2 && content.length >= 5 && canteenId > 0;
    }

    function checkPublishEnabled() {
        document.getElementById('publishBtn').disabled = !isPublishReady();
    }

    function renderImages() {
        const wrap = document.getElementById('imageStrip');
        wrap.innerHTML = '';

        state.images.forEach((src, index) => {
            const cell = document.createElement('div');
            cell.className = 'thumb';
            cell.innerHTML = `
                <img src="${src}" alt="img-${index}" onclick="openPreview('${src}')">
                <button class="thumb-delete" type="button" onclick="removeImage(${index})">×</button>
            `;
            wrap.appendChild(cell);
        });

        if (state.images.length < 9) {
            const upload = document.createElement('label');
            upload.className = 'thumb-upload';
            upload.innerHTML = '<div><i class="bi bi-plus-lg"></i><small>上传</small></div>';
            upload.addEventListener('click', () => document.getElementById('fileInput').click());
            wrap.appendChild(upload);
        }

        saveDraft();
    }

    function removeImage(index) {
        state.images.splice(index, 1);
        renderImages();
    }

    function openPreview(src) {
        const overlay = document.getElementById('imagePreviewOverlay');
        document.getElementById('imagePreviewTarget').src = src;
        overlay.classList.add('show');
    }

    async function loadCampuses() {
        const res = await fetchApi(API.CAMPUSES);
        if (res.code !== 200) {
            showToast(res.msg || '加载校区失败');
            return;
        }

        const list = normalizeCampusList(res);
        state.campuses = list;
        const select = document.getElementById('campusFilter');
        const currentCampusId = Number(res.data?.current_campus_id || list[0]?.id || 0);
        select.innerHTML = list.map((item) => `<option value="${Number(item.id || 0)}">${String(item.name || '-')}</option>`).join('');
        if (currentCampusId) select.value = String(currentCampusId);

        await loadCanteens();
    }

    async function loadCanteens() {
        const campusId = Number(document.getElementById('campusFilter').value || 0);
        const res = await fetchApi(`${API.PUBLIC_CANTEENS}?campus_id=${encodeURIComponent(campusId || 0)}`);
        if (res.code !== 200) {
            showToast(res.msg || '加载食堂失败');
            return;
        }

        state.canteens = normalizeCanteenList(res);
        filterCanteens();
    }

    function filterCanteens() {
        const keyword = String(document.getElementById('canteenSearch').value || '').trim().toLowerCase();
        state.filteredCanteens = state.canteens.filter((item) => String(item.name || '').toLowerCase().includes(keyword));

        const select = document.getElementById('canteenSelect');
        select.innerHTML = '<option value="">请选择评价的食堂</option>' +
            state.filteredCanteens.map((item) => `<option value="${Number(item.id || 0)}">${String(item.name || '-')}</option>`).join('');

        const draft = editId ? {} : JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}');
        if (draft.canteen_id && state.filteredCanteens.some((i) => Number(i.id) === Number(draft.canteen_id))) {
            select.value = String(draft.canteen_id);
        }

        loadWindows();
    }

    async function loadWindows() {
        const canteenId = Number(document.getElementById('canteenSelect').value || 0);
        const windowSelect = document.getElementById('windowSelect');
        windowSelect.innerHTML = '<option value="">选择具体窗口（选填）</option>';
        windowSelect.disabled = true;
        state.windows = [];

        if (!canteenId) {
            checkPublishEnabled();
            saveDraft();
            return;
        }

        const res = await fetchApi(`${API.WINDOWS}?canteen_id=${encodeURIComponent(canteenId)}`);
        if (res.code !== 200) {
            showToast(res.msg || '加载窗口失败');
            checkPublishEnabled();
            return;
        }

        state.windows = normalizeWindowList(res);
        windowSelect.innerHTML = '<option value="">选择具体窗口（选填）</option>' +
            state.windows.map((item) => `<option value="${Number(item.id || 0)}">${String(item.name || '-')}</option>`).join('');
        windowSelect.disabled = state.windows.length === 0;

        const draft = editId ? {} : JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}');
        if (draft.window_id && state.windows.some((i) => Number(i.id) === Number(draft.window_id))) {
            windowSelect.value = String(draft.window_id);
        }

        checkPublishEnabled();
        saveDraft();
    }

    function saveDraft() {
        if (editId) {
            checkPublishEnabled();
            return;
        }
        const draft = {
            title: document.getElementById('postTitle').value,
            content: document.getElementById('postContent').value,
            images: state.images,
            tags: buildTagList(),
            campus_id: Number(document.getElementById('campusFilter').value || 0),
            canteen_id: Number(document.getElementById('canteenSelect').value || 0),
            window_id: Number(document.getElementById('windowSelect').value || 0)
        };
        localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
        checkPublishEnabled();
    }

    function applyDraft() {
        const draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}');
        if (draft.title) document.getElementById('postTitle').value = draft.title;
        if (draft.content) document.getElementById('postContent').value = draft.content;
        if (Array.isArray(draft.images)) state.images = draft.images.slice(0, 9);
        renderImages();

        if (Array.isArray(draft.tags)) {
            const set = new Set(draft.tags.map((t) => String(t || '').trim()));
            document.querySelectorAll('#tagsRow .tag-pill').forEach((item) => {
                const val = String(item.textContent || '').trim().replace(/^#/, '');
                item.classList.toggle('active', set.has(val));
            });
        }
    }

    function toggleTag(el) {
        el.classList.toggle('active');
        saveDraft();
    }

    function addCustomTag() {
        const input = document.getElementById('customTagInput');
        const val = String(input.value || '').trim();
        if (!val) return;

        const row = document.getElementById('tagsRow');
        const tag = document.createElement('div');
        tag.className = 'tag-pill active';
        tag.textContent = '#' + val;
        tag.onclick = function () { toggleTag(this); };
        row.insertBefore(tag, document.querySelector('.custom-tag'));
        input.value = '';
        saveDraft();
    }

    function compressImageFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const maxSide = 1600;
                    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
                    const w = Math.max(1, Math.round(img.width * scale));
                    const h = Math.max(1, Math.round(img.height * scale));
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);

                    let quality = 0.88;
                    let out = canvas.toDataURL('image/jpeg', quality);
                    const maxBytes = 450 * 1024;
                    while (out.length * 0.75 > maxBytes && quality > 0.5) {
                        quality -= 0.08;
                        out = canvas.toDataURL('image/jpeg', quality);
                    }
                    resolve(out);
                };
                img.onerror = () => reject(new Error('图片读取失败'));
                img.src = String(event.target.result || '');
            };
            reader.onerror = () => reject(new Error('文件读取失败'));
            reader.readAsDataURL(file);
        });
    }

    async function handleFiles(files) {
        const selected = Array.from(files || []);
        if (!selected.length) return;
        if (state.images.length + selected.length > 9) {
            showToast('最多上传9张图片');
            return;
        }

        for (const file of selected) {
            if (!String(file.type || '').startsWith('image/')) {
                continue;
            }
            try {
                const compressed = await compressImageFile(file);
                state.images.push(compressed);
            } catch (e) {
                showToast('有图片压缩失败，已跳过');
            }
        }
        renderImages();
    }

    async function publishPost() {
        if (!isPublishReady()) {
            showToast('请完善信息后发布');
            return;
        }

        const payload = {
            title: document.getElementById('postTitle').value.trim(),
            content: document.getElementById('postContent').value.trim(),
            images: state.images,
            tags: buildTagList(),
            canteen_id: Number(document.getElementById('canteenSelect').value || 0),
            window_id: Number(document.getElementById('windowSelect').value || 0) || null
        };

        const btn = document.getElementById('publishBtn');
        btn.disabled = true;
        btn.textContent = editId ? '保存中...' : '发布中...';

        let res;
        if (editId) {
            res = await fetchApi(`${API.MY_NOTES}/${editId}`, {
                method: 'PUT',
                body: JSON.stringify(payload)
            });
        } else {
            res = await fetchApi(API.MY_NOTES, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
        }

        btn.textContent = editId ? '保存笔记' : '发布笔记';
        checkPublishEnabled();

        if (res.code !== 200) {
            showToast(res.msg || '发布失败');
            return;
        }

        if (!editId) {
            localStorage.removeItem(DRAFT_KEY);
        }
        showToast(editId ? '保存成功' : '发布成功');
        setTimeout(() => {
            window.location.href = 'user_center.html?tab=notes';
        }, 900);
    }

    async function loadEditData(noteId) {
        const res = await fetchApi(`${API.MY_NOTES}/${noteId}`);
        if (res.code !== 200 || !res.data) {
            showToast(res.msg || '加载笔记失败');
            return false;
        }
        const note = res.data;
        document.getElementById('postTitle').value = note.title || '';
        document.getElementById('postContent').value = note.content || '';
        state.images = Array.isArray(note.images) ? note.images.slice(0, 9) : [];
        renderImages();
        return true;
    }

    function goBack() {
        const msg = editId ? '确定放弃本次编辑吗？未保存内容将丢失。' : '确定取消发布吗？已填写内容会保存为草稿。';
        if (confirm(msg)) {
            if (!editId) {
                saveDraft();
            }
            window.history.back();
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const auth = await fetchApi(API.AUTH_ME);
        if (auth.code !== 200) {
            showToast('请先登录');
            setTimeout(() => { window.location.href = '/login'; }, 900);
            return;
        }

        const editRaw = new URLSearchParams(window.location.search).get('edit');
        if (editRaw && /^\d+$/.test(editRaw)) {
            editId = Number(editRaw);
            document.getElementById('pageTitle').textContent = '编辑笔记';
            document.getElementById('publishBtn').textContent = '保存笔记';
            document.getElementById('canteenSectionTitle').textContent = '食堂信息（编辑时可不改）';
        }

        if (!editId) {
            applyDraft();
        }
        await loadCampuses();
        if (editId) {
            await loadEditData(editId);
        }

        const fileInput = document.getElementById('fileInput');
        fileInput.addEventListener('change', async (event) => {
            await handleFiles(event.target.files);
            fileInput.value = '';
        });

        document.getElementById('publishBtn').addEventListener('click', publishPost);
        document.getElementById('postTitle').addEventListener('input', saveDraft);
        document.getElementById('postContent').addEventListener('input', saveDraft);
        document.getElementById('campusFilter').addEventListener('change', async () => {
            await loadCanteens();
            saveDraft();
        });
        document.getElementById('canteenSearch').addEventListener('input', filterCanteens);
        document.getElementById('canteenSelect').addEventListener('change', loadWindows);
        document.getElementById('windowSelect').addEventListener('change', saveDraft);
        document.getElementById('customTagInput').addEventListener('blur', addCustomTag);
        document.getElementById('customTagInput').addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault();
                addCustomTag();
            }
        });

        document.getElementById('imagePreviewOverlay').addEventListener('click', function () {
            this.classList.remove('show');
        });

        if (!editId) {
            setInterval(saveDraft, 5000);
        }
        checkPublishEnabled();
    });
</script>
</body>
</html>
